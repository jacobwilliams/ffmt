name = "fregex"
version = "0.1.0"
license = "MIT"
author = "Jacob Williams"
maintainer = "Jacob Williams"
description = "Backtracking regular expressions for modern Fortran, with Python re-compatible syntax"
keywords = ["regex", "regular expressions", "strings", "text"]

[build]
auto-executables = false
auto-tests = true
auto-examples = true
module-naming = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dev-dependencies]
test-drive = { git = "https://github.com/fortran-lang/test-drive", tag = "v0.5.0" }
