name = "ffmt"
version = "0.1.0"
license = "MIT"
author = "Jacob Williams"
maintainer = "Jacob Williams"
description = "A formatter for modern Fortran source code"
keywords = ["formatter", "fortran", "code style"]

[build]
auto-executables = false
auto-tests = true
auto-examples = true
module-naming = false

[[executable]]
name = "ffmt"
source-dir = "app"
main = "main.f90"

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dependencies]
fregex = { path = "fregex" }
toml-f = { git = "https://github.com/toml-f/toml-f", tag = "v0.5.2" }

[dev-dependencies]
test-drive = { git = "https://github.com/fortran-lang/test-drive", tag = "v0.5.0" }
