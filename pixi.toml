[workspace]
authors = ["Jacob Williams <jacobwilliams@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "fformat"
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "osx-64", "win-64"]
version = "0.1.0"

[tasks]
format = { cmd = "fpm run fformat --profile release -- .", description = "Format this repository with fformat itself" }
format-check = { cmd = "fpm run fformat --profile release -- --check .", description = "Check that this repository is formatted" }
graphviz-setup = { cmd = "dot -c", description = "Register the graphviz plugins that FORD uses for graphs" }
docs = { cmd = "ford ford.md", depends-on = ["graphviz-setup"], description = "Build the API documentation with FORD (into doc/)" }
test = { cmd = "fpm test", description = "Run the formatter tests" }
check-corpus = { cmd = "fpm test check_corpus --profile release --", description = "Check tokenization and block structure of Fortran files: pixi run check-corpus FILE... or --files-from LISTFILE" }
corpus = { cmd = "python bench/corpus.py", description = "Check fformat on other Fortran libraries (stdlib, fpm, json-fortran, cp2k, wannier90): pixi run corpus [--build] [NAME...]" }

[dependencies]
gfortran = "15.*"
fpm = ">=0.13.0,<0.14"
python = "3.13.*"
ford = ">=7.0"
graphviz = ">=14.1.2,<15"

[feature.bench.dependencies]
fprettify = "0.3.7.*"
rust = ">=1.87"

[feature.bench.tasks]
bench = { cmd = "python bench/benchmark.py", description = "Compare the speed of fformat, fprettify and fprettier: pixi run -e bench bench [--help]" }

[environments]
bench = ["bench"]
